name: Python CI

on:
  push:
    branches: ["dev", "master"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: python -m pytest

  # Code Scanning: Quality
  quality-scan:
    name: Code Scanning / Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint scan
        run: >
          ruff check src tests neural-network-template/neuralNetworkClass.py
          --output-format=sarif
          --output-file=ruff-results.sarif

      - name: Upload Ruff SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ruff-results.sarif
          category: ruff-quality

  # Code Scanning: Security
  security-scan:
    name: Code Scanning / Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Run Bandit source scan
        run: >
          bandit -r src neural-network-template
          -x neural-network-template/nn-test-interface.py

      - name: Audit Python dependencies
        run: pip-audit -r requirements-dev.txt

  codeql:
    name: Code Scanning / CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
