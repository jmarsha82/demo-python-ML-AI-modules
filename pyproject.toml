[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-python-ml-ai-modules"
version = "0.1.0"
description = "School-assignment Python exercises for statistics, machine learning, AI, and neural-network fundamentals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=src/ml_ai_modules",
    "--cov=neural-network-template",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
omit = [
    "neural-network-template/nn-test-interface.py",
    "*/tests/*",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "emails",
    "ml-100k",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "emails", "ml-100k"]
